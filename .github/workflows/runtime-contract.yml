name: Gold Perks runtime contract

on:
  push:
    paths:
      - 'src/**'
      - 'conf/**'
      - 'sql/world/**'
      - 'scripts/validate_runtime_contract.py'
      - '.github/workflows/runtime-contract.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'conf/**'
      - 'sql/world/**'
      - 'scripts/validate_runtime_contract.py'
      - '.github/workflows/runtime-contract.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_runtime_contract.py
      - run: git diff --check
