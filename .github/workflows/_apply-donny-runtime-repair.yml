name: Apply Donny runtime repair

on:
  push:
    branches:
      - agent/fix-donny-runtime
    paths:
      - scripts/_apply_donny_runtime_repair.py
      - .github/workflows/_apply-donny-runtime-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-donny-runtime
      - name: Apply repair
        run: python3 scripts/_apply_donny_runtime_repair.py
      - name: Validate repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cpp = Path('src/mod_gold_perks.cpp').read_text()
          conf = Path('conf/mod_gold_perks.conf.dist').read_text()
          assert conf.startswith('[worldserver]\n')
          assert 'PSendSysMessage("|cff66ff66Donny the Dealer|r: {}", text)' in cpp
          assert not re.search(r'PSendSysMessage\([^\n;]*%[sudi]', cpp)
          assert 'InspectDonnyTemplate' in cpp
          assert 'SetPocketRankVerified' in cpp
          assert 'No summon fee charged' in cpp
          assert 'Magical Overflow unavailable: set LFG.MailItemOnFullInventory = 2' in cpp
          print('Donny runtime invariants OK')
          PY
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "Nick"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_gold_perks.cpp conf/mod_gold_perks.conf.dist README.md sql/world/mod_gold_perks_world.sql
          git commit -m "Repair Donny gossip feedback and runtime safety"
          git push origin agent/fix-donny-runtime
